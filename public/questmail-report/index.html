<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuestMail Lead Report — QuestRock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <script src="/inbound-auth.js"></script>
    <style>
      :root {
        --navy: #0c2340;
        --navy-mid: #163a63;
        --gold: #c9a227;
        --ink: #1e293b;
        --muted: #64748b;
        --border: #cbd5e1;
        --paper: #ffffff;
        --green: #16a34a;
        --orange: #ea580c;
        --red: #dc2626;
        --blue: #2563eb;
        --purple: #7c3aed;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: var(--ink);
        background: #e8edf3;
        line-height: 1.45;
      }

      .screen-only {
        max-width: 920px;
        margin: 0 auto;
        padding: 1rem 1rem 3rem;
      }

      header.screen-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      header.screen-bar h1 { margin: 0; font-size: 1.15rem; color: var(--navy); }
      .sub { color: var(--muted); margin: 0; font-size: 0.88rem; }
      nav a { color: var(--muted); margin-left: 0.75rem; font-size: 0.85rem; text-decoration: none; }
      nav a:hover { color: var(--navy); }

      .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
      button {
        font: inherit; cursor: pointer; border-radius: 6px;
        padding: 0.45rem 0.9rem; border: 1px solid var(--border); background: var(--paper);
      }
      button.primary { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
      .loading, .error { padding: 2rem; text-align: center; color: var(--muted); }
      .error { color: var(--red); }

      #report {
        background: var(--paper);
        border: 1px solid #b8c4d4;
        box-shadow: 0 8px 32px rgba(12, 35, 64, 0.12);
      }

      .report-hero {
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
        color: #fff;
        text-align: center;
        padding: 1.75rem 1.5rem 1.5rem;
        border-bottom: 4px solid var(--gold);
      }

      .report-hero h2 {
        margin: 0;
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 2rem;
        letter-spacing: 0.06em;
        font-weight: 400;
      }

      .report-hero .cycle {
        margin: 0.35rem 0 0;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.75);
      }

      .report-hero .generated {
        margin-top: 0.5rem;
        font-size: 0.78rem;
        color: rgba(255,255,255,0.55);
      }

      .section {
        padding: 1.25rem 1.5rem 1.5rem;
        border-bottom: 1px solid var(--border);
      }

      .section:last-child { border-bottom: none; }

      .section-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        margin-right: 0.5rem;
        vertical-align: middle;
      }

      .section-title {
        display: inline;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--navy);
        vertical-align: middle;
      }

      .section-head { margin: 0 0 1rem; }

      /* Overview */
      .overview-grid {
        display: grid;
        grid-template-columns: 1fr 1.1fr 1fr;
        gap: 1rem;
        align-items: center;
      }

      .big-stat {
        text-align: center;
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 1rem 0.5rem;
      }

      .big-stat .num {
        font-size: 3.5rem;
        font-weight: 700;
        color: var(--navy);
        line-height: 1;
      }

      .big-stat .lbl {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-top: 0.35rem;
      }

      .pie-wrap { text-align: center; }
      .pie-wrap svg { max-width: 180px; height: auto; }

      .legend { font-size: 0.82rem; }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .legend-pct { margin-left: auto; font-weight: 600; color: var(--navy); }

      .summary-box {
        margin-top: 1rem;
        background: #f8fafc;
        border-left: 4px solid var(--gold);
        padding: 0.75rem 1rem;
        font-size: 0.86rem;
        color: var(--ink);
      }

      .summary-box strong { color: var(--navy); }

      /* Pipeline table */
      table.pipeline {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.84rem;
      }

      table.pipeline th,
      table.pipeline td {
        border: 1px solid var(--border);
        padding: 0.5rem 0.65rem;
        text-align: left;
      }

      table.pipeline th {
        background: var(--navy);
        color: #fff;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      table.pipeline tr.child td:first-child { padding-left: 1.75rem; color: var(--muted); }
      table.pipeline .count { font-weight: 700; color: var(--navy); }
      table.pipeline tfoot td { font-weight: 700; background: #f1f5f9; }

      .pipe-icon {
        display: inline-block;
        width: 1.1rem;
        text-align: center;
        margin-right: 0.35rem;
      }

      /* Scorecard */
      .score-icons {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.65rem;
        margin-bottom: 1.25rem;
      }

      .score-icon {
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 0.35rem;
      }

      .score-icon .emoji { font-size: 1.5rem; line-height: 1; }
      .score-icon .val { font-size: 1.75rem; font-weight: 700; color: var(--navy); line-height: 1.1; margin-top: 0.25rem; }
      .score-icon .lbl { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 0.2rem; }

      .conversion-flow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem 0.25rem;
        font-size: 0.82rem;
        margin-bottom: 1rem;
      }

      .conv-box {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.45rem 0.65rem;
        text-align: center;
        min-width: 7.5rem;
      }

      .conv-box .rate { font-size: 1.25rem; font-weight: 700; color: var(--navy); }
      .conv-box .lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .conv-arrow { color: var(--gold); font-size: 1.1rem; font-weight: 700; padding: 0 0.15rem; }

      .takeaway {
        background: linear-gradient(90deg, #f0f4f8, #fff);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.85rem 1rem;
        font-size: 0.86rem;
      }

      .takeaway dt {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--navy);
        font-weight: 700;
        margin-bottom: 0.35rem;
      }

      /* Detail appendix */
      .appendix { background: #f8fafc; }
      .appendix-toggle {
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        font-weight: 600;
        color: var(--navy);
        padding: 0;
        font-size: 0.85rem;
      }

      .detail-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin-top: 0.75rem; }
      .detail-table th, .detail-table td { border: 1px solid var(--border); padding: 0.35rem 0.5rem; text-align: left; }
      .detail-table th { background: #e2e8f0; font-size: 0.68rem; text-transform: uppercase; }

      .pill {
        display: inline-block;
        font-size: 0.62rem;
        font-weight: 600;
        text-transform: uppercase;
        padding: 0.1rem 0.4rem;
        border-radius: 999px;
        background: #e2e8f0;
      }

      @media (max-width: 720px) {
        .overview-grid { grid-template-columns: 1fr; }
        .score-icons { grid-template-columns: repeat(3, 1fr); }
      }

      @media print {
        body { background: #fff; }
        .no-print { display: none !important; }
        .screen-only { max-width: none; padding: 0; }
        #report { border: none; box-shadow: none; }
        .section { break-inside: avoid; }
        @page { margin: 0.5in; size: letter; }
      }
    </style>
  </head>
  <body>
    <div class="screen-only">
      <header class="screen-bar no-print">
        <div>
          <h1>QuestMail Lead Report</h1>
          <p class="sub">Nikk format · overview · pipeline · scorecard</p>
        </div>
        <div style="text-align:right">
          <span id="user-pill" class="sub"></span>
          <nav>
            <a href="/call-tracker/">Call Tracker</a>
            <a href="/mailer-import/">Import</a>
            <a href="#" id="sign-out">Sign out</a>
          </nav>
        </div>
      </header>

      <div class="actions no-print">
        <button type="button" id="backfill">Repair &amp; reprocess</button>
        <button type="button" class="primary" id="save-pdf">Save as PDF</button>
        <button type="button" id="refresh">Refresh</button>
      </div>

      <div id="status" class="loading no-print">Loading report…</div>
      <div id="report" hidden></div>
    </div>

    <script>
      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function fmtDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleString('en-US', {
          timeZone: 'America/New_York',
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
        });
      }

      function renderPie(slices, total) {
        if (!total || !slices.length) {
          return '<p class="sub">No leads to chart yet.</p>';
        }

        const cx = 90;
        const cy = 90;
        const r = 72;
        const ir = 42;
        let angle = -Math.PI / 2;
        const paths = [];

        for (const slice of slices) {
          const frac = slice.count / total;
          const sweep = frac * Math.PI * 2;
          const x1 = cx + r * Math.cos(angle);
          const y1 = cy + r * Math.sin(angle);
          angle += sweep;
          const x2 = cx + r * Math.cos(angle);
          const y2 = cy + r * Math.sin(angle);
          const ix1 = cx + ir * Math.cos(angle - sweep);
          const iy1 = cy + ir * Math.sin(angle - sweep);
          const ix2 = cx + ir * Math.cos(angle);
          const iy2 = cy + ir * Math.sin(angle);
          const large = sweep > Math.PI ? 1 : 0;
          paths.push(
            `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${ix2} ${iy2} A ${ir} ${ir} 0 ${large} 0 ${ix1} ${iy1} Z" fill="${slice.color}" />`,
          );
        }

        return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Lead outcome pie chart">${paths.join('')}</svg>`;
      }

      function pipelineIcon(key) {
        const icons = {
          package_out: '📦',
          verification_total: '✓',
          verification_pitched: '→',
          verification_waiting: '⏳',
          did_not_advance: '✕',
          bad_leads_spanish: '💬',
          do_not_call: '🚫',
        };
        return icons[key] || '•';
      }

      function renderPipelineTable(pipeline, totalLeads) {
        let rows = '';
        let total = 0;

        for (const row of pipeline.rows ?? []) {
          total += row.count;
          rows += `<tr>
            <td><span class="pipe-icon">${pipelineIcon(row.key)}</span>${esc(row.label)}</td>
            <td class="count">${row.count}</td>
            <td>${row.pct}%</td>
          </tr>`;
          for (const child of row.children ?? []) {
            rows += `<tr class="child">
              <td>${esc(child.label)}</td>
              <td class="count">${child.count}</td>
              <td>${child.pct}%</td>
            </tr>`;
          }
        }

        const nurture = pipeline.long_term_nurture ?? 0;
        if (nurture > 0) {
          total += nurture;
          rows += `<tr>
            <td><span class="pipe-icon">🌱</span>Long Term Nurture</td>
            <td class="count">${nurture}</td>
            <td>—</td>
          </tr>`;
        }

        return `<table class="pipeline">
          <thead><tr><th>Status</th><th>Count</th><th>% of Total Leads</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>TOTAL</td><td>${totalLeads ?? 0}</td><td>100%</td></tr></tfoot>
        </table>`;
      }

      function renderScorecard(sc) {
        const icons = [
          { emoji: '📞', val: sc.calls, lbl: 'Calls', color: 'var(--blue)' },
          { emoji: '📋', val: sc.apps, lbl: 'Apps', color: 'var(--green)' },
          { emoji: '📊', val: sc.credit, lbl: 'Credit', color: 'var(--orange)' },
          { emoji: '🔀', val: sc.pipes, lbl: 'Pipes', color: 'var(--purple)' },
          { emoji: '🤝', val: sc.closes, lbl: 'Closes', color: 'var(--red)' },
        ];

        const iconHtml = icons
          .map(
            (i) => `<div class="score-icon">
              <div class="emoji">${i.emoji}</div>
              <div class="val" style="color:${i.color}">${i.val}</div>
              <div class="lbl">${i.lbl}</div>
            </div>`,
          )
          .join('');

        const conv = [
          { rate: sc.calls_to_apps_rate, lbl: 'Calls → Apps Rate' },
          { rate: sc.apps_to_credit_rate, lbl: 'Apps → Credit Rate' },
          { rate: sc.credit_to_pipe_rate, lbl: 'Credit → Pipe Rate' },
          { rate: sc.pipe_to_close_rate, lbl: 'Pipe → Close Rate' },
        ];

        const convHtml = conv
          .map(
            (c, i) =>
              `${i ? '<span class="conv-arrow">→</span>' : ''}<div class="conv-box"><div class="rate">${c.rate}%</div><div class="lbl">${c.lbl}</div></div>`,
          )
          .join('');

        return `${iconHtml}<div class="conversion-flow">${convHtml}</div>
          <dl class="takeaway"><dt>Management Takeaway</dt><dd>${esc(sc.management_takeaway)}</dd></dl>`;
      }

      function renderAppendix(calls) {
        if (!calls?.length) return '';
        const rows = calls
          .map(
            (c) => `<tr>
              <td>${fmtDate(c.answered_at)}</td>
              <td>${esc(c.borrower_name)}</td>
              <td>${esc(c.ops_status_label || '—')}</td>
              <td>${esc(c.reference_code || '—')}</td>
              <td>${esc(c.lo_name || '—')}</td>
              ${c.status_mismatch ? '<td class="sub">Corrected</td>' : '<td>—</td>'}
            </tr>`,
          )
          .join('');

        return `<section class="section appendix">
          <details>
            <summary class="appendix-toggle">Call-level detail (${calls.length} calls)</summary>
            <table class="detail-table">
              <thead><tr><th>Date</th><th>Borrower</th><th>Status</th><th>Offer</th><th>LO</th><th>AI fix</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </details>
        </section>`;
      }

      function renderReport(data) {
        const lc = data.lead_cycle ?? {};
        const ov = lc.overview ?? {};
        const pl = lc.pipeline ?? {};
        const sc = lc.scorecard ?? {};

        const legend = (ov.pie ?? [])
          .map(
            (s) => `<div class="legend-row">
              <span class="dot" style="background:${s.color}"></span>
              <span>${esc(s.label)}</span>
              <span class="legend-pct">${s.count} (${s.pct}%)</span>
            </div>`,
          )
          .join('');

        return `<div class="report-hero">
          <h2>QUESTMAIL LEAD REPORT</h2>
          <p class="cycle">${esc(lc.cycle_label || 'CURRENT LEAD CYCLE')}</p>
          <p class="generated">Generated ${fmtDate(data.generated_at)} ET · ${lc.total_calls ?? 0} call(s) · ${lc.total_leads ?? 0} unique lead(s)</p>
        </div>

        <section class="section">
          <p class="section-head"><span class="section-num">01</span><span class="section-title">Overview</span></p>
          <div class="overview-grid">
            <div class="big-stat">
              <div class="num">${ov.total_questmail_leads ?? 0}</div>
              <div class="lbl">Total QuestMail Leads</div>
            </div>
            <div class="pie-wrap">${renderPie(ov.pie ?? [], ov.total_questmail_leads ?? 0)}</div>
            <div class="legend">${legend || '<p class="sub">No categorized leads yet.</p>'}</div>
          </div>
          <div class="summary-box"><strong>Overview Summary:</strong> ${esc(ov.summary || '')}</div>
        </section>

        <section class="section">
          <p class="section-head"><span class="section-num">02</span><span class="section-title">Pipeline Breakdown</span></p>
          ${renderPipelineTable(pl, lc.total_leads)}
          <div class="summary-box" style="margin-top:1rem"><strong>Pipeline Summary:</strong> ${esc(pl.summary || '')}</div>
        </section>

        <section class="section">
          <p class="section-head"><span class="section-num">03</span><span class="section-title">Performance Scorecard</span></p>
          ${renderScorecard(sc)}
        </section>

        ${renderAppendix(data.calls)}`;
      }

      async function load() {
        const status = document.getElementById('status');
        const reportEl = document.getElementById('report');
        status.hidden = false;
        status.textContent = 'Loading report…';
        status.className = 'loading no-print';
        reportEl.hidden = true;

        try {
          const data = await InboundAuth.apiGet('/api/questmail-report');
          reportEl.innerHTML = renderReport(data);
          reportEl.hidden = false;
          status.hidden = true;
          document.title = `QuestMail Lead Report (${data.lead_cycle?.total_leads ?? data.count} leads)`;
        } catch (err) {
          status.textContent = err.message || 'Failed to load report.';
          status.className = 'error no-print';
        }
      }

      document.getElementById('backfill').addEventListener('click', async () => {
        const status = document.getElementById('status');
        if (!confirm('Repair toll-free lead collisions and re-run AI on all QuestMail calls?')) return;
        status.hidden = false;
        status.textContent = 'Running backfill…';
        status.className = 'loading no-print';
        try {
          const data = await InboundAuth.apiPost('/api/questmail-backfill', {
            repair_phones: true,
            split_leads: true,
            reprocess: true,
            reprocess_limit: 100,
          });
          status.textContent = `Done — reprocessed ${data.reprocess?.reprocessed ?? 0} call(s). Refreshing…`;
          await load();
        } catch (err) {
          status.textContent = err.message || 'Backfill failed.';
          status.className = 'error no-print';
        }
      });

      document.getElementById('save-pdf').addEventListener('click', () => window.print());
      document.getElementById('refresh').addEventListener('click', () => load());
      document.getElementById('sign-out').addEventListener('click', (e) => {
        e.preventDefault();
        InboundAuth.signOut();
      });

      (async () => {
        const user = await InboundAuth.requireAuth({ requireCallTracker: true });
        if (!user) return;
        document.getElementById('user-pill').textContent = user.email;
        await load();
      })();
    </script>
  </body>
</html>
