<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuestRock — Call Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <script src="/inbound-auth.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --questmail: #f59e0b;
        --inbound: #38bdf8;
        --shape: #fb7185;
        --landing: #a78bfa;
        --accent: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        background: radial-gradient(circle at top, #1e3a5f 0%, var(--bg) 45%);
        color: var(--ink);
        min-height: 100vh;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        margin: 0 0 0.25rem;
        font-size: 1.75rem;
      }
      .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
      nav a {
        color: var(--muted);
        text-decoration: none;
        margin-left: 1rem;
        font-size: 0.9rem;
      }
      nav a:hover { color: var(--ink); }
      .toolbar, .state-bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      .state-bar label {
        width: 100%;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0.25rem 0 0;
      }
      button, .btn {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--ink);
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.active { background: #334155; border-color: #64748b; }
      button.primary { background: var(--accent); color: #052e16; border-color: transparent; font-weight: 600; }
      .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
      .list { display: grid; gap: 0.75rem; }
      .call {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .call-head {
        padding: 1rem 1.1rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.75rem 1rem;
        cursor: pointer;
        user-select: none;
      }
      .call-head:hover { background: rgba(255,255,255,0.02); }
      .call h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
      .phone { color: var(--muted); font-size: 0.9rem; }
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        margin-right: 0.35rem;
        margin-bottom: 0.25rem;
      }
      .badge.questmail { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
      .badge.inbound { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
      .badge.shape { background: rgba(251, 113, 133, 0.18); color: #fda4af; }
      .badge.landing { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; }
      .badge.status { background: rgba(74, 222, 128, 0.15); color: #86efac; }
      .badge.lo-disposition { background: rgba(96, 165, 250, 0.18); color: #93c5fd; margin-left: 0.35rem; }
      .badge.lo-disposition.mismatch { background: rgba(251, 191, 36, 0.2); color: #fcd34d; }
      .badge.pending { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
      .badge.sync-ok { background: rgba(74, 222, 128, 0.12); color: #86efac; }
      .badge.sync-skip { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
      .badge.sync-fail { background: rgba(248, 113, 113, 0.15); color: #fca5a5; }
      .qr-analysis {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
        border: 1px solid #475569;
        border-left: 4px solid var(--accent);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        margin-bottom: 0.5rem;
      }
      .qr-analysis-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.85rem;
      }
      .qr-analysis-head strong {
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .qr-analysis-section { margin-bottom: 0.85rem; }
      .qr-analysis-section:last-child { margin-bottom: 0; }
      .qr-analysis-section h4 {
        margin: 0 0 0.35rem;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #cbd5e1;
      }
      .qr-coaching {
        background: linear-gradient(135deg, rgba(30, 25, 15, 0.95) 0%, rgba(41, 37, 28, 0.9) 100%);
        border: 1px solid #78716c;
        border-left: 4px solid #f59e0b;
        border-radius: 10px;
        padding: 1rem 1.1rem;
        margin-bottom: 0.5rem;
      }
      .qr-coaching-head strong {
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fbbf24;
      }
      .qr-coaching pre {
        margin: 0.75rem 0 0;
        font-size: 0.88rem;
        line-height: 1.55;
        color: #fef3c7;
        white-space: pre-wrap;
        font-family: inherit;
        background: transparent;
        border: none;
        padding: 0;
      }
      .qr-coaching-section { margin-bottom: 0.85rem; }
      .qr-coaching-section:last-child { margin-bottom: 0; }
      .qr-coaching-section h4 {
        margin: 0 0 0.35rem;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #fcd34d;
      }
      .qr-coaching-section p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #fef3c7;
        white-space: pre-wrap;
      }
      .qr-analysis-section p {
        margin: 0;
        font-size: 0.9rem;
        line-height: 1.55;
        color: #e2e8f0;
        white-space: pre-wrap;
      }
      .field-list {
        margin: 0;
        padding: 0;
        list-style: none;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .field-list li {
        display: grid;
        grid-template-columns: minmax(140px, 38%) 1fr;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.84rem;
      }
      .field-list li:last-child { border-bottom: none; }
      .field-list .k { color: var(--muted); font-family: ui-monospace, monospace; font-size: 0.78rem; }
      .field-list .v { color: #e2e8f0; word-break: break-word; }
      .sync-box {
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        font-size: 0.88rem;
        line-height: 1.5;
      }
      .sync-box.ok { border-color: rgba(74, 222, 128, 0.35); }
      .sync-box.skip { border-color: rgba(148, 163, 184, 0.35); }
      .sync-box.fail { border-color: rgba(248, 113, 113, 0.35); }
      .details { color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
      .links { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
      .links a { color: #7dd3fc; font-size: 0.85rem; }
      .time { color: var(--muted); font-size: 0.82rem; white-space: nowrap; text-align: right; }
      .empty { color: var(--muted); padding: 2rem; text-align: center; }
      #user-pill {
        font-size: 0.82rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
      }
      .call-body {
        display: none;
        border-top: 1px solid var(--border);
        padding: 0 1.1rem 1rem;
        background: rgba(0,0,0,0.15);
        user-select: text;
        -webkit-user-select: text;
      }
      .call.open .call-body { display: block; }
      .call-body section { margin-top: 1rem; }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
      }
      .section-head h3 {
        margin: 0;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .copy-actions {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin: 0.75rem 0 0.25rem;
      }
      button.copy-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.72rem;
        padding: 0.25rem 0.55rem;
        border-radius: 6px;
        cursor: pointer;
      }
      button.copy-btn:hover {
        color: var(--ink);
        border-color: #64748b;
      }
      button.copy-btn.copied {
        color: #86efac;
        border-color: rgba(74, 222, 128, 0.45);
      }
      .call-body h3 {
        margin: 0 0 0.4rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .call-body p, .call-body pre, .call-body .copy-block {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.55;
        color: #e2e8f0;
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      .copy-block, .call-body pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      .call-body pre.transcript-block {
        max-height: 360px;
        overflow: auto;
      }
      .note-block {
        background: #0f172a;
        border-left: 3px solid #38bdf8;
        border-radius: 0 8px 8px 0;
        padding: 0;
        margin-top: 0;
        border: 1px solid var(--border);
        border-left: 3px solid #38bdf8;
      }
      .note-block .copy-block {
        border: none;
        border-radius: 0 8px 8px 0;
        background: transparent;
      }
      .chevron {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: 0.35rem;
      }
      .refetch-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }
      button.refetch {
        background: rgba(56, 189, 248, 0.12);
        border-color: rgba(56, 189, 248, 0.35);
        color: #7dd3fc;
        font-size: 0.82rem;
        padding: 0.35rem 0.75rem;
      }
      button.analyze {
        background: rgba(167, 139, 250, 0.12);
        border-color: rgba(167, 139, 250, 0.35);
        color: #c4b5fd;
        font-size: 0.82rem;
        padding: 0.35rem 0.75rem;
      }
      button.analyze:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button.secondary-analyze {
        background: transparent;
        border-color: var(--border);
        color: var(--muted);
        font-size: 0.78rem;
        padding: 0.3rem 0.65rem;
      }
      .refetch-msg {
        font-size: 0.82rem;
        color: var(--muted);
      }
      .refetch-msg.ok { color: #86efac; }
      .refetch-msg.err { color: #fca5a5; }
      .mailer-link-panel {
        margin-bottom: 1rem;
        padding: 0.9rem 1rem;
        background: rgba(245, 158, 11, 0.08);
        border: 1px solid rgba(245, 158, 11, 0.25);
        border-radius: 10px;
      }
      .mailer-link-panel h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
      .mailer-search-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.65rem;
      }
      .mailer-search-row input {
        flex: 1 1 12rem;
        min-width: 10rem;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--ink);
        padding: 0.45rem 0.85rem;
        font: inherit;
      }
      .mailer-search-row input:focus {
        outline: none;
        border-color: rgba(245, 158, 11, 0.55);
      }
      button.mailer-search,
      button.mailer-link {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.4);
        color: #fcd34d;
        font-size: 0.82rem;
        padding: 0.35rem 0.75rem;
      }
      .mailer-results {
        display: grid;
        gap: 0.45rem;
        margin-top: 0.75rem;
      }
      .mailer-hit {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.35rem 0.75rem;
        align-items: center;
        padding: 0.55rem 0.7rem;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.85rem;
      }
      .mailer-hit strong { display: block; }
      .mailer-hit .meta { color: var(--muted); font-size: 0.8rem; }
      .paste-panel {
        margin-top: 0.75rem;
        padding: 0.85rem;
        background: #0f172a;
        border: 1px dashed var(--border);
        border-radius: 8px;
      }
      .paste-panel summary {
        cursor: pointer;
        color: #c4b5fd;
        font-size: 0.84rem;
        font-weight: 500;
        user-select: none;
      }
      .paste-panel textarea {
        width: 100%;
        min-height: 140px;
        margin-top: 0.65rem;
        padding: 0.65rem 0.75rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #1e293b;
        color: #e2e8f0;
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
        line-height: 1.45;
        resize: vertical;
      }
      .paste-panel textarea:focus {
        outline: none;
        border-color: rgba(167, 139, 250, 0.5);
      }
      .paste-options {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 0.55rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .paste-options label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        cursor: pointer;
      }
      button.paste-save {
        margin-top: 0.55rem;
        background: rgba(167, 139, 250, 0.15);
        border-color: rgba(167, 139, 250, 0.4);
        color: #c4b5fd;
        font-size: 0.82rem;
        padding: 0.35rem 0.75rem;
      }
      button.open-shape {
        background: rgba(251, 113, 133, 0.15);
        border-color: rgba(251, 113, 133, 0.45);
        color: #fda4af;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 0.4rem 0.85rem;
        text-decoration: none;
        display: inline-block;
        border-radius: 999px;
      }
      button.open-shape:hover { background: rgba(251, 113, 133, 0.25); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Call Tracker</h1>
          <p class="sub">Transcripts · QuestRock AI analysis · landing page / UTM · admin only</p>
        </div>
        <div style="text-align:right">
          <span id="user-pill"></span>
          <nav>
            <a href="/questmail-report/">QuestMail Report</a>
            <a href="/mailer-import/">Import</a>
            <a href="/mailer-lo/">LO Desk</a>
            <a href="/shape-archive/">Archive</a>
            <a href="#" id="sign-out">Sign out</a>
          </nav>
        </div>
      </header>

      <div class="toolbar">
        <button type="button" class="filter active" data-channel="">All calls</button>
        <button type="button" class="filter" data-channel="questmail">QuestMail</button>
        <button type="button" class="filter" data-channel="inbound_zoom">Inbound ads</button>
        <button type="button" class="filter" data-channel="shape_inbound">Shape leads</button>
        <button type="button" class="filter active" data-hours="24">Today</button>
        <button type="button" class="filter" data-hours="168">Week</button>
        <button type="button" class="filter" data-hours="720">Month</button>
        <button type="button" id="refresh" class="primary">Refresh</button>
      </div>

      <div class="state-bar">
        <label>Landing page / UTM state</label>
        <button type="button" class="state-filter active" data-state="">All states</button>
        <button type="button" class="state-filter" data-state="FL">FL</button>
        <button type="button" class="state-filter" data-state="GA">GA</button>
        <button type="button" class="state-filter" data-state="NC">NC</button>
        <button type="button" class="state-filter" data-state="SC">SC</button>
        <button type="button" class="state-filter" data-state="TN">TN</button>
        <button type="button" class="state-filter" data-state="TX">TX</button>
      </div>

      <p class="meta" id="meta">Loading…</p>
      <div class="list" id="list"></div>
    </div>

    <script>
      let channel = '';
      let state = '';
      let hours = 24;
      let openCallId = null;

      function fmtTime(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleString('en-US', {
          timeZone: 'America/New_York',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
        });
      }

      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function badgeClass(c) {
        if (c.call_channel === 'questmail') return 'questmail';
        if (c.call_channel === 'shape_inbound') return 'shape';
        if (c.landing_page_label) return 'landing';
        return 'inbound';
      }

      function hoursLabel(h) {
        if (h <= 24) return 'today';
        if (h <= 168) return '7 days';
        if (h <= 720) return '30 days';
        return `${h}h`;
      }

      function copyBtn(label = 'Copy') {
        return `<button type="button" class="copy-btn" data-copy-label="${esc(label)}">${label}</button>`;
      }

      function hiddenCopySource(id, text) {
        if (!text) return '';
        return `<textarea class="copy-source" id="${esc(id)}" hidden readonly aria-hidden="true">${esc(text)}</textarea>`;
      }

      function copySection(title, text) {
        if (!text) return '';
        return `<section class="copy-section">
          <div class="section-head">
            <h3>${title}</h3>
            ${copyBtn('Copy')}
          </div>
          <div class="note-block"><pre class="copy-block">${esc(text)}</pre></div>
        </section>`;
      }

      function formatExtractedFieldsText(fields) {
        if (!fields?.length) return '';
        return fields.map((row) => `${row.field}: ${row.value}`).join('\n');
      }

      function formatQuestRockAnalysisText(analysis) {
        if (!analysis || typeof analysis !== 'object') return '';
        const sections = [
          ['Context & Key Participants', analysis.context_and_participants],
          ['Financial & Loan Profile', analysis.financial_and_loan_profile],
          ['Sales Pitch & Value Proposition', analysis.sales_pitch_and_value],
          ['Key Friction Points & Barriers', analysis.friction_and_barriers],
          ['Next Steps & Status', analysis.next_steps_and_status],
        ];
        return sections
          .filter(([, body]) => String(body ?? '').trim())
          .map(([title, body]) => `## ${title}\n${String(body).trim()}`)
          .join('\n\n');
      }

      const RAY_COACHING_SECTIONS = [
        ['ONE-LINE VERDICT', 'one_line_verdict'],
        ['CALL PHASE', 'call_phase'],
        ['RAY OUTCOME CODE', 'ray_outcome_code'],
        ['FIELD SCORECARD', 'field_scorecard'],
        ['FIRST CALL SCORE', 'first_call_score'],
        ['KPI SCORE', 'kpi_score'],
        ['DONE WELL', 'done_well'],
        ['FIX NOW', 'fix_now'],
        ['SAY THIS NEXT', 'say_this_next'],
        ['RAY SCRIPT TO DEPLOY', 'ray_script'],
        ['MISSED ON THIS CALL', 'missed_on_call'],
        ['PROGRAM FIT', 'program_fit'],
        ['TURNDOWN / SALVAGE REVIEW', 'turndown_salvage'],
        ['NON-NEGOTIABLE FLAGS', 'non_negotiable_flags'],
        ['CONVERSION MOVE', 'conversion_move'],
      ];

      function formatRayCoachingText(rayCoaching) {
        if (!rayCoaching || typeof rayCoaching !== 'object') return '';
        return RAY_COACHING_SECTIONS.filter(([, key]) => String(rayCoaching[key] ?? '').trim())
          .map(([title, key]) => `${title}:\n${String(rayCoaching[key]).trim()}`)
          .join('\n\n');
      }

      function renderPanelCopyHead(title, copyText, copyId) {
        if (!copyText) return `<h3>${title}</h3>`;
        return `<div class="section-head">
          <h3>${title}</h3>
          <button type="button" class="copy-btn" data-copy-source="${esc(copyId)}">Copy</button>
          ${hiddenCopySource(copyId, copyText)}
        </div>`;
      }

      function renderQuestRockAnalysis(analysis, copyId = 'qr-analysis') {
        const text = formatQuestRockAnalysisText(analysis);
        if (!text) return '';
        const sections = [
          ['Context & Key Participants', analysis.context_and_participants],
          ['Financial & Loan Profile', analysis.financial_and_loan_profile],
          ['Sales Pitch & Value Proposition', analysis.sales_pitch_and_value],
          ['Key Friction Points & Barriers', analysis.friction_and_barriers],
          ['Next Steps & Status', analysis.next_steps_and_status],
        ].filter(([, body]) => String(body ?? '').trim());

        const body = sections
          .map(
            ([title, content]) =>
              `<div class="qr-analysis-section"><h4>${esc(title)}</h4><p>${esc(String(content).trim())}</p></div>`,
          )
          .join('');

        return `<section class="copy-section qr-analysis-wrap">
          ${renderPanelCopyHead('QuestRock AI · Call analysis', text, copyId)}
          <div class="qr-analysis">
            ${body}
          </div>
        </section>`;
      }

      function renderLoCoaching(rayCoaching, salesNotesFallback, copyId = 'lo-coaching') {
        const structuredText = formatRayCoachingText(rayCoaching);
        const legacyText = String(salesNotesFallback ?? '').trim();
        const text = structuredText || legacyText;
        if (!text) return '';

        if (structuredText) {
          const body = RAY_COACHING_SECTIONS.filter(([, key]) =>
            String(rayCoaching[key] ?? '').trim(),
          )
            .map(([title, key]) => {
              const content = String(rayCoaching[key]).trim();
              const inner = title === 'FIELD SCORECARD' ? `<pre>${esc(content)}</pre>` : `<p>${esc(content)}</p>`;
              return `<div class="qr-coaching-section"><h4>${esc(title)}</h4>${inner}</div>`;
            })
            .join('');

          return `<section class="copy-section qr-coaching-wrap">
            ${renderPanelCopyHead("LO Coaching · Ray's playbook", structuredText, copyId)}
            <div class="qr-coaching">${body}</div>
          </section>`;
        }

        return `<section class="copy-section qr-coaching-wrap">
          ${renderPanelCopyHead("LO Coaching · Ray's playbook", legacyText, copyId)}
          <div class="qr-coaching"><pre>${esc(legacyText)}</pre></div>
        </section>`;
      }

      function buildAiReviewText(c) {
        const parts = [];
        const qr = formatQuestRockAnalysisText(c.questrock_analysis);
        if (qr) parts.push(`--- QuestRock AI Analysis ---\n${qr}`);
        if (c.ai_status_label) parts.push(`Status: ${c.ai_status_label}`);
        if (c.call_summary) parts.push(`\n--- Call summary ---\n${c.call_summary}`);
        if (c.status_rationale) parts.push(`\n--- Why this status ---\n${c.status_rationale}`);
        const coachingText = formatRayCoachingText(c.ray_coaching) || c.sales_notes;
        if (coachingText) parts.push(`\n--- LO Coaching (Ray's Playbook) ---\n${coachingText}`);
        if (c.ops_notes) parts.push(`\n--- Ops Notes ---\n${c.ops_notes}`);
        const fieldsText = formatExtractedFieldsText(c.extracted_fields);
        if (fieldsText) parts.push(`\n--- Extracted Shape Fields ---\n${fieldsText}`);
        if (c.shape_sync?.message) parts.push(`\n--- Shape Sync ---\n${c.shape_sync.message}`);
        return parts.join('\n').trim();
      }

      function buildFullCallText(c) {
        const ai = buildAiReviewText(c);
        const parts = [];
        parts.push(`${c.borrower_name || 'Unknown'} · ${c.phone || 'No phone'}`);
        if (c.lo_name) parts.push(`LO: ${c.lo_name}`);
        if (ai) parts.push('\n' + ai);
        if (c.transcript_text) parts.push(`\n--- Transcript ---\n${c.transcript_text}`);
        return parts.join('\n').trim();
      }

      function renderExtractedFields(fields) {
        if (!fields?.length) return '';
        const text = formatExtractedFieldsText(fields);
        return copySection(`Extracted Shape fields (${fields.length})`, text);
      }

      function renderShapeSync(sync) {
        if (!sync) return '';
        const state = sync.state || (sync.synced ? 'synced' : sync.skipped ? 'skipped' : 'failed');
        const cls = state === 'synced' ? 'ok' : state === 'skipped' ? 'skip' : 'fail';
        const badgeCls = state === 'synced' ? 'sync-ok' : state === 'skipped' ? 'sync-skip' : 'sync-fail';
        const badgeLabel = state === 'synced' ? 'Shape synced' : state === 'skipped' ? 'Shape skipped' : 'Shape failed';
        const fields =
          sync.fields_sent?.length
            ? `\nFields updated: ${sync.fields_sent.join(', ')}`
            : '';
        const syncText = `${badgeLabel}\n${sync.message || '—'}${fields}`;
        return `<section class="copy-section"><div class="section-head"><h3>Shape CRM sync</h3>${copyBtn('Copy')}</div>
          <div class="sync-box ${cls}">
            <span class="badge ${badgeCls}">${badgeLabel}</span>
            <pre class="copy-block" style="margin-top:0.5rem;border:none;background:transparent;padding:0">${esc(syncText)}</pre>
          </div></section>`;
      }

      function renderCall(c) {
        const statusStyle = c.ai_status_color
          ? ` style="background:${esc(c.ai_status_color)};color:#fff"`
          : '';
        const statusBadge = c.ai_status_label
          ? `<span class="badge status" title="QuestRock AI"${statusStyle}>QuestRock AI: ${esc(c.ai_status_label)}</span>`
          : c.pending_disposition
            ? `<span class="badge pending">Disposition email pending</span>`
            : `<span class="badge pending">${
              c.transcript_state === 'needs_ai'
                ? 'Transcript ready — run QuestRock AI'
                : c.transcript_state === 'awaiting_identification'
                  ? 'QuestMail — awaiting ID'
                  : c.transcript_state === 'awaiting_call'
                    ? 'Shape lead — awaiting call'
                    : c.transcript_state === 'pending'
                    ? 'Awaiting transcript'
                    : 'AI processing'
            }</span>`;

        const loDispositionBadge = c.lo_disposition_label
          ? `<span class="badge lo-disposition${c.lo_disposition_mismatch ? ' mismatch' : ''}" title="LO selected">LO: ${esc(c.lo_disposition_label)}</span>`
          : '';

        const landingBadge = c.landing_page_label
          ? `<span class="badge landing">${esc(c.landing_page_label)}</span>`
          : '';

        const utm = c.utm_campaign ? ` · UTM ${esc(c.utm_campaign)}` : '';
        const dialed = c.dialed_number_display ? ` · Dialed ${esc(c.dialed_number_display)}` : '';

        const links = [];
        if (c.shape_url) {
          links.push(
            `<a class="open-shape" href="${c.shape_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open in Shape #${esc(c.shape_lead_id)}</a>`,
          );
        }
        if (c.mailer_desk_url) links.push(`<a href="${c.mailer_desk_url}" onclick="event.stopPropagation()">Offer ${esc(c.reference_code)}</a>`);

        const loDispositionSection = c.lo_disposition_label
          ? copySection(
              'LO disposition',
              `Status: ${c.lo_disposition_label}${c.lo_disposition_note ? `\n\nNote:\n${c.lo_disposition_note}` : ''}${c.lo_disposition_mismatch ? '\n\n⚠ LO status differs from QuestRock AI suggestion' : ''}`,
            )
          : '';
        const copyPrefix = `copy-${c.call_id}`;
        const questRockAnalysis = renderQuestRockAnalysis(c.questrock_analysis, `${copyPrefix}-qr`);
        const summaryFallback =
          !formatQuestRockAnalysisText(c.questrock_analysis) && c.call_summary
            ? copySection('Call summary (QuestRock AI)', c.call_summary)
            : '';
        const rationale = copySection('Why this status (QuestRock AI)', c.status_rationale);
        const loCoaching = renderLoCoaching(c.ray_coaching, c.sales_notes, `${copyPrefix}-coaching`);
        const ops = copySection('Ops notes', c.ops_notes);

        const aiReviewText = buildAiReviewText(c);
        const fullCallText = buildFullCallText(c);
        const hiddenCopySources = [
          hiddenCopySource(`${copyPrefix}-ai`, aiReviewText),
          hiddenCopySource(`${copyPrefix}-transcript`, c.transcript_text),
          hiddenCopySource(`${copyPrefix}-all`, fullCallText),
        ].join('');
        const copyActions =
          c.transcript_text || aiReviewText
            ? `<div class="copy-actions">
                ${aiReviewText ? `<button type="button" class="copy-btn" data-copy-source="${copyPrefix}-ai">Copy QuestRock AI</button>` : ''}
                ${c.transcript_text ? `<button type="button" class="copy-btn" data-copy-source="${copyPrefix}-transcript">Copy transcript</button>` : ''}
                ${fullCallText ? `<button type="button" class="copy-btn" data-copy-source="${copyPrefix}-all">Copy all</button>` : ''}
              </div>${hiddenCopySources}`
            : '';

        const needsAnalyze = Boolean(c.needs_ai_analysis);
        const analyzeBlock =
          c.transcript_text && needsAnalyze
            ? `<div class="refetch-row">
              <button type="button" class="analyze" data-call-id="${esc(c.call_id)}">Run QuestRock AI analysis</button>
              <span class="refetch-msg" data-analyze-msg="${esc(c.call_id)}">Transcript saved — QuestRock AI not run yet.</span>
            </div>`
            : c.transcript_text
              ? `<div class="refetch-row">
              <button type="button" class="analyze secondary-analyze" data-call-id="${esc(c.call_id)}">Re-run QuestRock AI</button>
              <span class="refetch-msg" data-analyze-msg="${esc(c.call_id)}"></span>
            </div>`
              : '';

        const extracted = renderExtractedFields(c.extracted_fields);
        const shapeSync = renderShapeSync(c.shape_sync);

        const pastePanel = !c.transcript_text
          ? `<details class="paste-panel" data-paste-panel="${esc(c.call_id)}">
              <summary>${c.is_shape_arrival ? 'Paste call transcript' : 'Paste transcript from Zoom (if re-fetch fails)'}</summary>
              <textarea data-paste-input="${esc(c.call_id)}" placeholder="${c.is_shape_arrival ? 'Paste the call transcript here after the borrower calls in…' : 'Copy the full transcript from Zoom Phone → Call History → View transcript, then paste here…'}"></textarea>
              <div class="paste-options">
                <label><input type="checkbox" data-paste-run-ai="${esc(c.call_id)}" checked /> Run QuestRock AI after save</label>
              </div>
              <button type="button" class="paste-save" data-paste-save="${esc(c.call_id)}">Save pasted transcript</button>
              <span class="refetch-msg" data-paste-msg="${esc(c.call_id)}"></span>
            </details>`
          : '';

        const needsRefetch =
          !c.transcript_text &&
          !c.is_shape_arrival &&
          (c.transcript_state === 'pending' ||
            c.transcript_state === 'processing' ||
            c.transcript_state === 'awaiting_identification');
        const refetchBlock = needsRefetch
          ? `<div class="refetch-row">
              <button type="button" class="refetch" data-call-id="${esc(c.call_id)}">Re-fetch from Zoom</button>
              <span class="refetch-msg" data-refetch-msg="${esc(c.call_id)}"></span>
            </div>`
          : '';

        const mailerLinkBlock = c.needs_mailer_link
          ? `<section class="mailer-link-panel" onclick="event.stopPropagation()">
              <h3>Link mailer lead</h3>
              <p class="details">QuestMail could not auto-match offer code or callback phone. Search imported mailer by zip, name, street, or offer code — then link to attach the Shape record and run AI.</p>
              <div class="mailer-search-row">
                <input type="search" data-mailer-q="${esc(c.call_id)}" placeholder="38305, Pirtle, Comanche, offer code…" />
                <button type="button" class="mailer-search" data-mailer-search="${esc(c.call_id)}">Search</button>
              </div>
              <div class="mailer-results" data-mailer-results="${esc(c.call_id)}"></div>
              <span class="refetch-msg" data-mailer-msg="${esc(c.call_id)}"></span>
            </section>`
          : '';

        const transcript = c.transcript_text
          ? `<section class="copy-section"><div class="section-head"><h3>Transcript</h3>${copyBtn('Copy')}</div>${analyzeBlock}<pre class="copy-block transcript-block">${esc(c.transcript_text)}</pre></section>`
          : c.transcript_state === 'awaiting_call'
            ? `<section><h3>Transcript</h3><p class="details">Lead arrived from Shape — paste the call transcript once the borrower calls in.</p>${pastePanel}</section>`
          : c.transcript_state !== 'pending'
            ? `<section><h3>Transcript</h3><p class="details">Still processing…</p>${refetchBlock}${pastePanel}</section>`
            : `<section><h3>Transcript</h3><p class="details">Not received yet — usually ~5–10 min after the call. If it stays stuck, pull it from Zoom.</p>${refetchBlock}${pastePanel}</section>`;

        const isOpen = openCallId === c.call_id;

        return `<article class="call${isOpen ? ' open' : ''}" data-call-id="${esc(c.call_id)}">
          <div class="call-head" role="button" tabindex="0">
            <div>
              <span class="badge ${badgeClass(c)}">${esc(c.channel_label)}</span>
              ${landingBadge}
              ${statusBadge}
              ${loDispositionBadge}
              <h2>${esc(c.borrower_name)} <span class="chevron">${isOpen ? '▾' : '▸'}</span></h2>
              <div class="phone">${esc(c.phone || 'No phone')}</div>
              <div class="details">
                LO: <strong>${esc(c.lo_name || 'Unassigned')}</strong>
                ${c.contact_found ? ' · Existing lead' : ' · New lead'}
                ${c.reference_code ? ` · Code ${esc(c.reference_code)}` : ''}
                ${utm}${dialed}
                ${c.lead_status_label ? ` · Shape: ${esc(c.lead_status_label)}` : ''}
              </div>
              ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
            </div>
            <div class="time">${fmtTime(c.answered_at)} ET</div>
          </div>
          <div class="call-body" onclick="event.stopPropagation()">
            ${mailerLinkBlock}
            ${copyActions}
            ${loDispositionSection}
            ${questRockAnalysis || summaryFallback}
            ${loCoaching}
            ${rationale}
            ${extracted}
            ${shapeSync}
            ${ops}
            ${transcript}
          </div>
        </article>`;
      }

      async function copyText(text, btn) {
        const value = String(text ?? '').trim();
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = value;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        if (btn) {
          const label = btn.dataset.copyLabel || 'Copy';
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = label;
            btn.classList.remove('copied');
          }, 1600);
        }
      }

      function bindCopyHandlers() {
        document.querySelectorAll('button.copy-btn').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (btn.dataset.copySource) {
              const el = document.getElementById(btn.dataset.copySource);
              await copyText(el?.value ?? '', btn);
              return;
            }
            const block =
              btn.closest('.copy-section')?.querySelector('.copy-block') ||
              btn.closest('section')?.querySelector('.copy-block');
            await copyText(block?.textContent ?? '', btn);
          });
        });
      }

      function bindExpandHandlers() {
        document.querySelectorAll('.call-head').forEach((head) => {
          head.addEventListener('click', () => {
            const article = head.closest('.call');
            const id = article?.dataset.callId;
            openCallId = openCallId === id ? null : id;
            document.querySelectorAll('.call').forEach((el) => {
              el.classList.toggle('open', el.dataset.callId === openCallId);
              const chev = el.querySelector('.chevron');
              if (chev) chev.textContent = el.dataset.callId === openCallId ? '▾' : '▸';
            });
          });
        });
      }

      function bindAnalyzeHandlers() {
        document.querySelectorAll('button.analyze').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const callId = btn.dataset.callId;
            const msg = document.querySelector(`[data-analyze-msg="${callId}"]`);
            btn.disabled = true;
            if (msg) {
              msg.textContent = 'Running QuestRock AI analysis…';
              msg.className = 'refetch-msg';
            }
            try {
              const data = await InboundAuth.apiPost('/api/call-tracker-analyze', { call_id: callId });
              if (msg) {
                msg.textContent = data.ai_status_label
                  ? `Done — ${data.ai_status_label}`
                  : data.message || 'Analysis complete.';
                msg.className = 'refetch-msg ok';
              }
              await load();
              openCallId = callId;
              document.querySelectorAll('.call').forEach((el) => {
                el.classList.toggle('open', el.dataset.callId === openCallId);
              });
            } catch (err) {
              if (msg) {
                msg.textContent = err.message || 'QuestRock AI analysis failed.';
                msg.className = 'refetch-msg err';
              }
              btn.disabled = false;
            }
          });
        });
      }

      function bindPasteHandlers() {
        document.querySelectorAll('button[data-paste-save]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const callId = btn.dataset.pasteSave;
            const textarea = document.querySelector(`[data-paste-input="${callId}"]`);
            const runAiEl = document.querySelector(`[data-paste-run-ai="${callId}"]`);
            const msg = document.querySelector(`[data-paste-msg="${callId}"]`);
            const text = textarea?.value?.trim() ?? '';

            if (text.length < 40) {
              if (msg) {
                msg.textContent = 'Paste the full transcript first (at least a few lines).';
                msg.className = 'refetch-msg err';
              }
              return;
            }

            btn.disabled = true;
            if (msg) {
              msg.textContent = runAiEl?.checked ? 'Saving and running QuestRock AI…' : 'Saving transcript…';
              msg.className = 'refetch-msg';
            }

            try {
              const data = await InboundAuth.apiPost('/api/call-tracker-paste-transcript', {
                call_id: callId,
                transcript_text: text,
                run_ai: runAiEl?.checked !== false,
              });
              if (msg) {
                msg.textContent = data.skipped
                  ? data.message
                  : data.ai_status_label
                    ? `Done — ${data.ai_status_label}`
                    : data.message || 'Transcript saved.';
                msg.className = data.skipped ? 'refetch-msg err' : 'refetch-msg ok';
              }
              await load();
              openCallId = callId;
              document.querySelectorAll('.call').forEach((el) => {
                el.classList.toggle('open', el.dataset.callId === openCallId);
              });
            } catch (err) {
              if (msg) {
                msg.textContent = err.message || 'Save failed.';
                msg.className = 'refetch-msg err';
              }
              btn.disabled = false;
            }
          });
        });

        document.querySelectorAll('.paste-panel').forEach((panel) => {
          panel.addEventListener('toggle', (e) => e.stopPropagation());
          panel.addEventListener('click', (e) => e.stopPropagation());
        });
      }

      function bindMailerLinkHandlers() {
        document.querySelectorAll('button[data-mailer-search]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const callId = btn.dataset.mailerSearch;
            const input = document.querySelector(`[data-mailer-q="${callId}"]`);
            const resultsEl = document.querySelector(`[data-mailer-results="${callId}"]`);
            const msg = document.querySelector(`[data-mailer-msg="${callId}"]`);
            const q = input?.value?.trim() ?? '';
            if (q.length < 2) {
              if (msg) {
                msg.textContent = 'Enter at least 2 characters to search.';
                msg.className = 'refetch-msg err';
              }
              return;
            }
            btn.disabled = true;
            if (msg) {
              msg.textContent = 'Searching mailer…';
              msg.className = 'refetch-msg';
            }
            if (resultsEl) resultsEl.innerHTML = '';
            try {
              const data = await InboundAuth.apiGet(
                `/api/call-tracker-link-mailer?q=${encodeURIComponent(q)}`,
              );
              const rows = data.results ?? [];
              if (!rows.length) {
                if (msg) {
                  msg.textContent = 'No mailer rows found — try zip, last name, or street.';
                  msg.className = 'refetch-msg err';
                }
                return;
              }
              if (resultsEl) {
                resultsEl.innerHTML = rows
                  .map((row) => {
                    const name =
                      row.full_name ||
                      [row.first_name, row.last_name].filter(Boolean).join(' ') ||
                      'Unknown';
                    const addr = [row.address_line_1, row.city, row.state, row.zip_code]
                      .filter(Boolean)
                      .join(', ');
                    return `<div class="mailer-hit">
                      <div>
                        <strong>${esc(name)}</strong>
                        <div class="meta">${esc(row.reference_code || 'No code')} · ${esc(addr || 'No address')}</div>
                      </div>
                      <button type="button" class="mailer-link" data-mailer-link="${esc(callId)}" data-mailer-id="${esc(row.mailer_lead_id)}">Link &amp; run QuestRock AI</button>
                    </div>`;
                  })
                  .join('');
                bindMailerLinkHandlers();
              }
              if (msg) {
                msg.textContent = `${rows.length} match(es) — pick the correct row.`;
                msg.className = 'refetch-msg ok';
              }
            } catch (err) {
              if (msg) {
                msg.textContent = err.message || 'Search failed.';
                msg.className = 'refetch-msg err';
              }
            } finally {
              btn.disabled = false;
            }
          });
        });

        document.querySelectorAll('button[data-mailer-link]').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const callId = btn.dataset.mailerLink;
            const mailerId = btn.dataset.mailerId;
            const msg = document.querySelector(`[data-mailer-msg="${callId}"]`);
            btn.disabled = true;
            if (msg) {
              msg.textContent = 'Linking mailer row and running QuestRock AI…';
              msg.className = 'refetch-msg';
            }
            try {
              const data = await InboundAuth.apiPost('/api/call-tracker-link-mailer', {
                call_id: callId,
                mailer_lead_id: mailerId,
                run_ai: true,
              });
              if (msg) {
                msg.textContent = data.ai_status_label
                  ? `${data.message || 'Linked.'} — ${data.ai_status_label}`
                  : data.message || 'Mailer linked.';
                msg.className = 'refetch-msg ok';
              }
              await load();
              openCallId = callId;
              document.querySelectorAll('.call').forEach((el) => {
                el.classList.toggle('open', el.dataset.callId === openCallId);
              });
            } catch (err) {
              if (msg) {
                msg.textContent = err.message || 'Link failed.';
                msg.className = 'refetch-msg err';
              }
              btn.disabled = false;
            }
          });
        });

        document.querySelectorAll('.mailer-link-panel input').forEach((input) => {
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              e.stopPropagation();
              const callId = input.dataset.mailerQ;
              const btn = document.querySelector(`[data-mailer-search="${callId}"]`);
              btn?.click();
            }
          });
          input.addEventListener('click', (e) => e.stopPropagation());
        });
      }

      function bindRefetchHandlers() {
        document.querySelectorAll('button.refetch').forEach((btn) => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const callId = btn.dataset.callId;
            const msg = document.querySelector(`[data-refetch-msg="${callId}"]`);
            btn.disabled = true;
            if (msg) {
              msg.textContent = 'Pulling from Zoom…';
              msg.className = 'refetch-msg';
            }
            try {
              const data = await InboundAuth.apiPost('/api/call-tracker-refetch', { call_id: callId });
              if (msg) {
                msg.textContent = data.skipped
                  ? data.message || 'Already saved.'
                  : `Done — ${data.ai_status_label || 'processed'}.`;
                msg.className = 'refetch-msg ok';
              }
              await load();
              openCallId = callId;
              document.querySelectorAll('.call').forEach((el) => {
                el.classList.toggle('open', el.dataset.callId === openCallId);
              });
            } catch (err) {
              if (msg) {
                msg.textContent = err.message || 'Re-fetch failed.';
                msg.className = 'refetch-msg err';
              }
              btn.disabled = false;
            }
          });
        });
      }

      async function load() {
        const params = new URLSearchParams({ hours: String(hours), limit: '100' });
        if (channel) params.set('channel', channel);
        if (state) params.set('state', state);
        const data = await InboundAuth.apiGet(`/api/call-tracker?${params}`);
        const list = document.getElementById('list');
        document.getElementById('meta').textContent =
          `${data.count} call(s) · last ${data.view_label || hoursLabel(hours)}${state ? ` · ${state} landing` : ''} · updated ${fmtTime(data.generated_at)} ET`;
        if (!data.calls?.length) {
          list.innerHTML = '<p class="empty">No calls in this window yet.</p>';
          return;
        }
        list.innerHTML = data.calls.map(renderCall).join('');
        bindExpandHandlers();
        bindRefetchHandlers();
        bindAnalyzeHandlers();
        bindCopyHandlers();
        bindPasteHandlers();
        bindMailerLinkHandlers();
      }

      document.querySelectorAll('.filter[data-channel]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter[data-channel]').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          channel = btn.dataset.channel || '';
          load().catch((e) => alert(e.message));
        });
      });

      document.querySelectorAll('.state-filter').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.state-filter').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          state = btn.dataset.state || '';
          load().catch((e) => alert(e.message));
        });
      });

      document.querySelectorAll('.filter[data-hours]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter[data-hours]').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          hours = Number(btn.dataset.hours);
          load().catch((e) => alert(e.message));
        });
      });

      document.getElementById('refresh').addEventListener('click', () => load().catch((e) => alert(e.message)));
      document.getElementById('sign-out').addEventListener('click', (e) => {
        e.preventDefault();
        InboundAuth.signOut();
      });

      (async () => {
        const user = await InboundAuth.requireAuth({ requireCallTracker: true });
        if (!user) return;
        document.getElementById('user-pill').textContent = user.email;
        await load();
        setInterval(() => load().catch(() => {}), 30000);
      })();
    </script>
  </body>
</html>
