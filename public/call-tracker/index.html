<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuestRock — Call Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <script src="/inbound-auth.js"></script>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --questmail: #f59e0b;
        --inbound: #38bdf8;
        --landing: #a78bfa;
        --accent: #4ade80;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        background: radial-gradient(circle at top, #1e3a5f 0%, var(--bg) 45%);
        color: var(--ink);
        min-height: 100vh;
      }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        margin: 0 0 0.25rem;
        font-size: 1.75rem;
      }
      .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
      nav a {
        color: var(--muted);
        text-decoration: none;
        margin-left: 1rem;
        font-size: 0.9rem;
      }
      nav a:hover { color: var(--ink); }
      .toolbar, .state-bar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      .state-bar label {
        width: 100%;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0.25rem 0 0;
      }
      button, .btn {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--ink);
        border-radius: 999px;
        padding: 0.45rem 0.9rem;
        font: inherit;
        cursor: pointer;
      }
      button.active { background: #334155; border-color: #64748b; }
      button.primary { background: var(--accent); color: #052e16; border-color: transparent; font-weight: 600; }
      .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
      .list { display: grid; gap: 0.75rem; }
      .call {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      .call-head {
        padding: 1rem 1.1rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.75rem 1rem;
        cursor: pointer;
      }
      .call-head:hover { background: rgba(255,255,255,0.02); }
      .call h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
      .phone { color: var(--muted); font-size: 0.9rem; }
      .badge {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        margin-right: 0.35rem;
        margin-bottom: 0.25rem;
      }
      .badge.questmail { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
      .badge.inbound { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
      .badge.landing { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; }
      .badge.status { background: rgba(74, 222, 128, 0.15); color: #86efac; }
      .badge.pending { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
      .details { color: var(--muted); font-size: 0.88rem; line-height: 1.5; }
      .links { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
      .links a { color: #7dd3fc; font-size: 0.85rem; }
      .time { color: var(--muted); font-size: 0.82rem; white-space: nowrap; text-align: right; }
      .empty { color: var(--muted); padding: 2rem; text-align: center; }
      #user-pill {
        font-size: 0.82rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
      }
      .call-body {
        display: none;
        border-top: 1px solid var(--border);
        padding: 0 1.1rem 1rem;
        background: rgba(0,0,0,0.15);
      }
      .call.open .call-body { display: block; }
      .call-body section { margin-top: 1rem; }
      .call-body h3 {
        margin: 0 0 0.4rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .call-body p, .call-body pre {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.55;
        color: #e2e8f0;
      }
      .call-body pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        max-height: 280px;
        overflow: auto;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
      }
      .note-block {
        background: #0f172a;
        border-left: 3px solid #38bdf8;
        border-radius: 0 8px 8px 0;
        padding: 0.65rem 0.85rem;
        margin-top: 0.35rem;
      }
      .chevron {
        color: var(--muted);
        font-size: 0.85rem;
        margin-left: 0.35rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Call Tracker</h1>
          <p class="sub">Transcripts · AI status · landing page / UTM · admin only</p>
        </div>
        <div style="text-align:right">
          <span id="user-pill"></span>
          <nav>
            <a href="/mailer-import/">Import</a>
            <a href="/mailer-lo/">LO Desk</a>
            <a href="/shape-archive/">Archive</a>
            <a href="#" id="sign-out">Sign out</a>
          </nav>
        </div>
      </header>

      <div class="toolbar">
        <button type="button" class="filter active" data-channel="">All calls</button>
        <button type="button" class="filter" data-channel="questmail">QuestMail</button>
        <button type="button" class="filter" data-channel="inbound_zoom">Inbound ads</button>
        <button type="button" class="filter" data-hours="24">24h</button>
        <button type="button" class="filter" data-hours="168">7 days</button>
        <button type="button" id="refresh" class="primary">Refresh</button>
      </div>

      <div class="state-bar">
        <label>Landing page / UTM state</label>
        <button type="button" class="state-filter active" data-state="">All states</button>
        <button type="button" class="state-filter" data-state="FL">FL</button>
        <button type="button" class="state-filter" data-state="GA">GA</button>
        <button type="button" class="state-filter" data-state="NC">NC</button>
        <button type="button" class="state-filter" data-state="SC">SC</button>
        <button type="button" class="state-filter" data-state="TN">TN</button>
        <button type="button" class="state-filter" data-state="TX">TX</button>
      </div>

      <p class="meta" id="meta">Loading…</p>
      <div class="list" id="list"></div>
    </div>

    <script>
      let channel = '';
      let state = '';
      let hours = 168;
      let openCallId = null;

      function fmtTime(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleString('en-US', {
          timeZone: 'America/New_York',
          month: 'short',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
        });
      }

      function esc(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/"/g, '&quot;');
      }

      function badgeClass(c) {
        if (c.call_channel === 'questmail') return 'questmail';
        if (c.landing_page_label) return 'landing';
        return 'inbound';
      }

      function renderCall(c) {
        const statusBadge = c.ai_status_label
          ? `<span class="badge status">${esc(c.ai_status_label)}</span>`
          : `<span class="badge pending">${c.transcript_state === 'pending' ? 'Awaiting transcript' : 'Processing'}</span>`;

        const landingBadge = c.landing_page_label
          ? `<span class="badge landing">${esc(c.landing_page_label)}</span>`
          : '';

        const utm = c.utm_campaign ? ` · UTM ${esc(c.utm_campaign)}` : '';
        const dialed = c.dialed_number_display ? ` · Dialed ${esc(c.dialed_number_display)}` : '';

        const links = [];
        if (c.shape_url) links.push(`<a href="${c.shape_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Shape #${c.shape_lead_id}</a>`);
        if (c.mailer_desk_url) links.push(`<a href="${c.mailer_desk_url}" onclick="event.stopPropagation()">Offer ${esc(c.reference_code)}</a>`);

        const summary = c.call_summary
          ? `<section><h3>AI summary</h3><div class="note-block"><p>${esc(c.call_summary)}</p></div></section>`
          : '';

        const rationale = c.status_rationale
          ? `<section><h3>Why this status</h3><p>${esc(c.status_rationale)}</p></section>`
          : '';

        const sales = c.sales_notes
          ? `<section><h3>Sales notes (LO / AI)</h3><div class="note-block"><p>${esc(c.sales_notes)}</p></div></section>`
          : '';

        const ops = c.ops_notes
          ? `<section><h3>Ops notes</h3><div class="note-block"><p>${esc(c.ops_notes)}</p></div></section>`
          : '';

        const transcript = c.transcript_text
          ? `<section><h3>Transcript</h3><pre>${esc(c.transcript_text)}</pre></section>`
          : c.transcript_state !== 'pending'
            ? `<section><h3>Transcript</h3><p class="details">Still processing…</p></section>`
            : `<section><h3>Transcript</h3><p class="details">Not received yet — usually ~5–10 min after the call.</p></section>`;

        const isOpen = openCallId === c.call_id;

        return `<article class="call${isOpen ? ' open' : ''}" data-call-id="${esc(c.call_id)}">
          <div class="call-head" role="button" tabindex="0">
            <div>
              <span class="badge ${badgeClass(c)}">${esc(c.channel_label)}</span>
              ${landingBadge}
              ${statusBadge}
              <h2>${esc(c.borrower_name)} <span class="chevron">${isOpen ? '▾' : '▸'}</span></h2>
              <div class="phone">${esc(c.phone || 'No phone')}</div>
              <div class="details">
                LO: <strong>${esc(c.lo_name || 'Unassigned')}</strong>
                ${c.contact_found ? ' · Existing lead' : ' · New lead'}
                ${c.reference_code ? ` · Code ${esc(c.reference_code)}` : ''}
                ${utm}${dialed}
                ${c.lead_status_label ? ` · Shape: ${esc(c.lead_status_label)}` : ''}
              </div>
              ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
            </div>
            <div class="time">${fmtTime(c.answered_at)} ET</div>
          </div>
          <div class="call-body">
            ${summary}
            ${rationale}
            ${sales}
            ${ops}
            ${transcript}
          </div>
        </article>`;
      }

      function bindExpandHandlers() {
        document.querySelectorAll('.call-head').forEach((head) => {
          head.addEventListener('click', () => {
            const article = head.closest('.call');
            const id = article?.dataset.callId;
            openCallId = openCallId === id ? null : id;
            document.querySelectorAll('.call').forEach((el) => {
              el.classList.toggle('open', el.dataset.callId === openCallId);
              const chev = el.querySelector('.chevron');
              if (chev) chev.textContent = el.dataset.callId === openCallId ? '▾' : '▸';
            });
          });
        });
      }

      async function load() {
        const params = new URLSearchParams({ hours: String(hours), limit: '100' });
        if (channel) params.set('channel', channel);
        if (state) params.set('state', state);
        const data = await InboundAuth.apiGet(`/api/call-tracker?${params}`);
        const list = document.getElementById('list');
        document.getElementById('meta').textContent =
          `${data.count} call(s) · last ${hours === 24 ? '24 hours' : '7 days'}${state ? ` · ${state} landing` : ''} · updated ${fmtTime(data.generated_at)} ET`;
        if (!data.calls?.length) {
          list.innerHTML = '<p class="empty">No calls in this window yet.</p>';
          return;
        }
        list.innerHTML = data.calls.map(renderCall).join('');
        bindExpandHandlers();
      }

      document.querySelectorAll('.filter[data-channel]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter[data-channel]').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          channel = btn.dataset.channel || '';
          load().catch((e) => alert(e.message));
        });
      });

      document.querySelectorAll('.state-filter').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.state-filter').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          state = btn.dataset.state || '';
          load().catch((e) => alert(e.message));
        });
      });

      document.querySelectorAll('.filter[data-hours]').forEach((btn) => {
        btn.addEventListener('click', () => {
          hours = Number(btn.dataset.hours);
          load().catch((e) => alert(e.message));
        });
      });

      document.getElementById('refresh').addEventListener('click', () => load().catch((e) => alert(e.message)));
      document.getElementById('sign-out').addEventListener('click', (e) => {
        e.preventDefault();
        InboundAuth.signOut();
      });

      (async () => {
        const user = await InboundAuth.requireAuth({ requireCallTracker: true });
        if (!user) return;
        document.getElementById('user-pill').textContent = user.email;
        await load();
        setInterval(() => load().catch(() => {}), 30000);
      })();
    </script>
  </body>
</html>
