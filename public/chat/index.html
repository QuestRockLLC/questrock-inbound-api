<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuestRock — Pipeline Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1412;
        --panel: #1a221e;
        --card: #232d28;
        --ink: #eef2f0;
        --muted: #9aaba3;
        --accent: #6fcf97;
        --accent-dim: #2d6a4f;
        --border: #35443c;
        --user-bg: #2d6a4f;
        --bot-bg: #1f2a24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(1200px 600px at 10% -10%, #1e3d2f 0%, transparent 55%), var(--bg);
        min-height: 100vh;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 1rem;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        margin: 0;
        font-size: 1.6rem;
      }
      .sub { color: var(--muted); margin: 0.25rem 0 0; font-size: 0.9rem; max-width: 34rem; }
      .nav a { color: var(--accent); margin-left: 0.85rem; font-weight: 600; text-decoration: none; font-size: 0.85rem; }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.65rem;
        align-items: end;
        margin-bottom: 0.85rem;
      }
      @media (max-width: 640px) { .toolbar { grid-template-columns: 1fr; } }
      label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--muted); }
      input, textarea, button { font: inherit; border-radius: 10px; border: 1px solid var(--border); }
      input, textarea {
        width: 100%;
        padding: 0.55rem 0.7rem;
        background: var(--panel);
        color: var(--ink);
      }
      .password-wrap { display: flex; gap: 0.35rem; }
      .password-wrap input { flex: 1; min-width: 0; }
      .password-wrap button {
        width: auto;
        padding: 0.55rem 0.75rem;
        background: var(--card);
        color: var(--ink);
        cursor: pointer;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        margin-bottom: 0.75rem;
      }
      .pill {
        font-size: 0.75rem;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .pill strong { color: var(--accent); }
      .suggestions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
      .suggestions button {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent-dim);
        padding: 0.35rem 0.65rem;
        font-size: 0.78rem;
        cursor: pointer;
      }
      .chat {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        min-height: 420px;
        overflow: hidden;
      }
      .messages {
        flex: 1;
        overflow: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .msg {
        max-width: 88%;
        padding: 0.75rem 0.9rem;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        font-size: 0.92rem;
      }
      .msg.user { align-self: flex-end; background: var(--user-bg); }
      .msg.bot { align-self: flex-start; background: var(--bot-bg); border: 1px solid var(--border); }
      .msg.system {
        align-self: center;
        background: transparent;
        color: var(--muted);
        font-size: 0.8rem;
        padding: 0.25rem;
      }
      .sources {
        margin-top: 0.5rem;
        padding-top: 0.5rem;
        border-top: 1px solid var(--border);
        font-size: 0.75rem;
        color: var(--muted);
      }
      .sources span {
        display: inline-block;
        margin: 0.15rem 0.35rem 0.15rem 0;
        padding: 0.1rem 0.4rem;
        background: var(--card);
        border-radius: 6px;
      }
      .composer {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid var(--border);
        background: var(--card);
      }
      .composer textarea {
        flex: 1;
        resize: none;
        min-height: 44px;
        max-height: 120px;
      }
      .composer button {
        background: var(--accent);
        color: #0f1412;
        font-weight: 700;
        padding: 0 1.1rem;
        cursor: pointer;
        border: 0;
      }
      .composer button:disabled { opacity: 0.45; cursor: not-allowed; }
      .status { font-size: 0.78rem; color: var(--muted); padding: 0 0.75rem 0.65rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <h1>Pipeline Chat</h1>
          <p class="sub">Ask about stalled inbound leads, statuses, notes, and next steps — powered by your Shape archive + OpenAI.</p>
        </div>
        <div class="nav">
          <span id="user-label" class="sub" style="margin:0"></span>
          <button type="button" id="sign-out-btn" style="padding:0.45rem 0.75rem;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer">Sign out</button>
          <a href="/shape-archive/">Archive</a>
          <a href="/mailer-lo/">LO Desk</a>
          <a href="/mailer-import/">Import</a>
        </div>
      </header>

      <div class="toolbar">
        <button id="load-meta" type="button" style="padding:0.55rem 0.9rem;background:var(--card);color:var(--ink);cursor:pointer;border:1px solid var(--border);border-radius:10px">Load archive</button>
      </div>

      <div class="meta" id="meta"></div>

      <div class="suggestions">
        <button type="button" data-q="Which inbound leads look stuck or stalled right now?">Stuck leads</button>
        <button type="button" data-q="Show Long Term Nurture purchase leads that need drip follow-up.">Long Term Nurture</button>
        <button type="button" data-q="Which Did Not Advance refi leads need manager review?">Refi manager review</button>
        <button type="button" data-q="Summarize Inbound Shape Phone leads with no notes.">Shape Phone no notes</button>
      </div>

      <div class="chat">
        <div class="messages" id="messages">
          <div class="msg system">Load archive, then ask a question.</div>
        </div>
        <div class="status" id="status"></div>
        <form class="composer" id="composer">
          <textarea id="input" rows="2" placeholder="e.g. Which GA refi leads haven’t moved in 30+ days?"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </div>
    </div>

    <script src="/inbound-auth.js"></script>
    <script>
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('input');
      const statusEl = document.getElementById('status');
      const metaEl = document.getElementById('meta');
      const sendBtn = document.getElementById('send');

      let history = [];

      function addMessage(role, content, sources) {
        const empty = messagesEl.querySelector('.msg.system');
        if (empty) empty.remove();

        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.textContent = content;

        if (role === 'bot' && sources?.length) {
          const src = document.createElement('div');
          src.className = 'sources';
          src.innerHTML = 'Sources: ' + sources.map((s) =>
            `<span>${s.full_name || 'Lead'} · #${s.shape_lead_id} · ${s.mstrstatus1 || '—'}</span>`,
          ).join('');
          div.appendChild(src);
        }

        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function loadMeta() {
        const res = await fetch('/api/chat', { credentials: 'include' });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Failed to load archive meta');

        metaEl.innerHTML = '';
        if (!data.batch) {
          metaEl.innerHTML = '<span class="pill">No archive batch found — run Shape Archive first.</span>';
          return;
        }

        metaEl.innerHTML = [
          `<span class="pill"><strong>${data.lead_count ?? 0}</strong> leads</span>`,
          `<span class="pill"><strong>${data.note_count ?? 0}</strong> notes</span>`,
          `<span class="pill">${data.batch.date_from} → ${data.batch.date_to}</span>`,
          ...(data.status_counts ?? []).slice(0, 5).map((row) =>
            `<span class="pill">${row.status}: <strong>${row.count}</strong></span>`,
          ),
        ].join('');
      }

      document.getElementById('load-meta').addEventListener('click', async () => {
        try {
          statusEl.textContent = 'Loading archive…';
          await loadMeta();
          statusEl.textContent = 'Archive loaded.';
        } catch (e) {
          statusEl.textContent = '';
          alert(e.message);
        }
      });

      document.querySelectorAll('.suggestions button').forEach((btn) => {
        btn.addEventListener('click', () => {
          inputEl.value = btn.dataset.q;
          inputEl.focus();
        });
      });

      document.getElementById('composer').addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage('user', text);
        inputEl.value = '';
        sendBtn.disabled = true;
        statusEl.textContent = 'Thinking…';

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              history,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Chat failed');

          addMessage('bot', data.answer, data.sources);
          history.push({ role: 'user', content: text });
          history.push({ role: 'assistant', content: data.answer });
          if (history.length > 12) history = history.slice(-12);
          statusEl.textContent = `Used ${data.leads_retrieved} lead(s) from archive · ${data.model || 'AI'}`;
        } catch (err) {
          addMessage('bot', `Error: ${err.message}`);
          statusEl.textContent = '';
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      });

      document.getElementById('sign-out-btn').addEventListener('click', () => InboundAuth.signOut());

      (async () => {
        const user = await InboundAuth.requireAuth({ requireAdmin: true });
        if (!user) return;
        document.getElementById('user-label').textContent = user.name;
        loadMeta().catch(() => {});
      })();
    </script>
  </body>
</html>
